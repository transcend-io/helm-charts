# Docs: https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
suite: Deployment
templates:
  - deployment.yaml
release:
  name: testing
tests:
  - it: should work
    set:
      autoscaling.enabled: false
      namespace: test-ns
      transcend_service.port: 6041
      customer_service.port: 6042
      llm-classifier.enabled: true
      sombra-job-scheduler.enabled: true
      image.tag: v7.444.2
      datadog.serviceName: testing-sombra-service
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: metadata.namespace
          value: test-ns
      - equal:
          path: metadata.name
          value: testing-sombra
      - equal:
          path: spec.template.spec.containers[0].name
          value: sombra
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 2
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: external
            containerPort: 6041
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].ports[1]
          value:
            name: internal
            containerPort: 6042
            protocol: TCP
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: sombra
            app.kubernetes.io/instance: testing
            app.kubernetes.io/managed-by: Helm
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.transcend.io/sombra:v7.444.2
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /health
              port: 5042
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
            successThreshold: 1
            periodSeconds: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /health
              port: 5042
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            periodSeconds: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /health
              port: 5042
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 30
            failureThreshold: 30
            successThreshold: 1
            periodSeconds: 10
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DD_SERVICE_NAME
            value: "testing-sombra-service"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ORGANIZATION_URI
            value: "some-org"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IS_MULTI
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SOMBRA_ID
            value: "some-id"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATA_SUBJECT_AUTHENTICATION_METHODS
            value: "transcend,session"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMPLOYEE_AUTHENTICATION_METHODS
            value: "transcend,session"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLM_CLASSIFIER_URL
            value: "http://testing-llm-classifier.test-ns.svc:6081"

  - it: should render fieldRef env vars from envs_field_ref
    set:
      namespace: test-ns
      envs_field_ref:
        - name: POD_NAME
          fieldPath: metadata.name
        - name: POD_IP
          fieldPath: status.podIP
        - name: NODE_NAME
          fieldPath: spec.nodeName
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName

  - it: should not render fieldRef env vars when envs_field_ref is empty
    set:
      namespace: test-ns
      envs_field_ref: []
    asserts:
      - isKind:
          of: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: should allow overriding startupProbe values
    set:
      namespace: test-ns
      startupProbe:
        httpGet:
          path: /custom-health
          port: 6042
          scheme: HTTPS
        initialDelaySeconds: 5
        timeoutSeconds: 15
        failureThreshold: 60
        successThreshold: 1
        periodSeconds: 5
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /custom-health
              port: 6042
              scheme: HTTPS
            initialDelaySeconds: 5
            timeoutSeconds: 15
            failureThreshold: 60
            successThreshold: 1
            periodSeconds: 5

  - it: should not render startupProbe when disabled
    set:
      namespace: test-ns
      startupProbe: null
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: should render both regular envs and fieldRef envs together
    set:
      namespace: test-ns
      envs:
        - name: ORGANIZATION_URI
          value: "test-org"
      envs_field_ref:
        - name: POD_NAME
          fieldPath: metadata.name
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ORGANIZATION_URI
            value: "test-org"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

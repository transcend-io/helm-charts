# Docs: https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
suite: Deployment
templates:
  - deployment.yaml
release:
  name: testing
tests:
  - it: should work
    set:
      autoscaling.enabled: false
      namespace: test-ns
      transcend_service.port: 6041
      customer_service.port: 6042
      llm-classifier.enabled: true
      sombra-job-scheduler.enabled: true
      image.tag: v7.444.2
      datadog.serviceName: testing-sombra-service
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: metadata.namespace
          value: test-ns
      - equal:
          path: metadata.name
          value: testing-sombra
      - equal:
          path: spec.template.spec.containers[0].name
          value: sombra
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 2
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: external
            containerPort: 6041
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].ports[1]
          value:
            name: internal
            containerPort: 6042
            protocol: TCP
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: sombra
            app.kubernetes.io/instance: testing
            app.kubernetes.io/managed-by: Helm
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.transcend.io/sombra:v7.444.2
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /health
              port: 5042
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
            successThreshold: 1
            periodSeconds: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /health
              port: 5042
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            periodSeconds: 10
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /health
              port: 5042
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 30
            failureThreshold: 30
            successThreshold: 1
            periodSeconds: 10
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DD_SERVICE_NAME
            value: "testing-sombra-service"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ORGANIZATION_URI
            value: "some-org"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IS_MULTI
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SOMBRA_ID
            value: "some-id"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATA_SUBJECT_AUTHENTICATION_METHODS
            value: "transcend,session"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMPLOYEE_AUTHENTICATION_METHODS
            value: "transcend,session"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLM_CLASSIFIER_URL
            value: "http://testing-llm-classifier.test-ns.svc:6081"

  - it: should render fieldRef env vars from envs_field_ref
    set:
      namespace: test-ns
      envs_field_ref:
        - name: POD_NAME
          fieldPath: metadata.name
        - name: POD_IP
          fieldPath: status.podIP
        - name: NODE_NAME
          fieldPath: spec.nodeName
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName

  - it: should not render fieldRef env vars when envs_field_ref is empty
    set:
      namespace: test-ns
      envs_field_ref: []
    asserts:
      - isKind:
          of: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: should allow overriding startupProbe values
    set:
      namespace: test-ns
      startupProbe:
        httpGet:
          path: /custom-health
          port: 6042
          scheme: HTTPS
        initialDelaySeconds: 5
        timeoutSeconds: 15
        failureThreshold: 60
        successThreshold: 1
        periodSeconds: 5
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /custom-health
              port: 6042
              scheme: HTTPS
            initialDelaySeconds: 5
            timeoutSeconds: 15
            failureThreshold: 60
            successThreshold: 1
            periodSeconds: 5

  - it: should not render startupProbe when disabled
    set:
      namespace: test-ns
      startupProbe: null
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: should render both regular envs and fieldRef envs together
    set:
      namespace: test-ns
      envs:
        - name: ORGANIZATION_URI
          value: "test-org"
      envs_field_ref:
        - name: POD_NAME
          fieldPath: metadata.name
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ORGANIZATION_URI
            value: "test-org"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: should not render the OPA sidecar by default
    set:
      namespace: test-ns
    asserts:
      - isKind:
          of: Deployment
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: sombra
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.metadata.annotations

  - it: should render the OPA sidecar when enabled with config
    set:
      namespace: test-ns
      opa:
        enabled: true
        config:
          services:
            bundle_service:
              url: http://127.0.0.1:5042
          bundles:
            seneca:
              service: bundle_service
              resource: /seneca/bundles/active
          decision_logs:
            console: true
    asserts:
      - isKind:
          of: Deployment
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: opa
      - equal:
          path: spec.template.spec.containers[1].image
          value: openpolicyagent/opa:0.70.0-static
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: IfNotPresent
      - contains:
          path: spec.template.spec.containers[1].args
          content: run
      - contains:
          path: spec.template.spec.containers[1].args
          content: --server
      - contains:
          path: spec.template.spec.containers[1].args
          content: --addr=127.0.0.1:8181
      - contains:
          path: spec.template.spec.containers[1].args
          content: --config-file=/opa/config/opa-config.yaml
      - equal:
          path: spec.template.spec.containers[1].ports[0]
          value:
            name: opa
            containerPort: 8181
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[1].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[1].readinessProbe.httpGet.port
          value: 8181
      - equal:
          path: spec.template.spec.containers[1].startupProbe.httpGet.port
          value: 8181
      - equal:
          path: spec.template.spec.containers[1].resources
          value:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      - equal:
          path: spec.template.spec.containers[1].lifecycle.preStop.exec.command
          value:
            - /bin/sh
            - -c
            - sleep 5
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: opa-config
            mountPath: /opa/config
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: opa-config
            configMap:
              name: testing-sombra-opa-config
              defaultMode: 0444
      - exists:
          path: spec.template.metadata.annotations["checksum/opa-config"]

  - it: should render OPA without config-file or config volume when config is empty
    set:
      namespace: test-ns
      opa:
        enabled: true
    asserts:
      - isKind:
          of: Deployment
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - notContains:
          path: spec.template.spec.containers[1].args
          content: --config-file=/opa/config/opa-config.yaml
      - notExists:
          path: spec.template.spec.containers[1].volumeMounts
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.metadata.annotations

  - it: should render OPA env and args overrides
    set:
      namespace: test-ns
      opa:
        enabled: true
        args:
          - run
          - --server
          - --addr=127.0.0.1:9191
        env:
          - name: SENECA_BUNDLE_PROXY_URL
            value: http://127.0.0.1:5042
        envFrom:
          - configMapRef:
              name: opa-extra
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - run
            - --server
            - --addr=127.0.0.1:9191
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: SENECA_BUNDLE_PROXY_URL
            value: http://127.0.0.1:5042
      - contains:
          path: spec.template.spec.containers[1].envFrom
          content:
            configMapRef:
              name: opa-extra

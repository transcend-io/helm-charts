# Default values for sombra-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Namespace in which resources will be deployed
# Create new namespace
createNewNameSpace: true
# Name of new namespace, to use existing one set `createNewNameSpace` to `false`.
namespace: transcend

# Number of instances for the Sombra service.
replicaCount: 1

# Registry server and credential details
# The username will always be "Transcend" (this is case-sensitive),
# and the password will be any API Key for your organization within
# the Admin Dashboard (note: a scope is not required for the API key).
# This will be stored as a docker config secret, named `transcend-registry`
imageCredentials:
  # Set this to false to disable creating a dockerconfigjson file with these credentials.
  # Useful when you don't need username:password based auth for the registry, for ex. when
  # pulling using IAM from ECR.
  enabled: true
  registry: docker.transcend.io
  username: Transcend
  password: null

image:
  # Repository to use for Sombra image
  repository: docker.transcend.io/sombra
  # Define the pullPolicy for Sombra image
  pullPolicy: IfNotPresent
  # Sombra version to deploy
  tag: 'latest'

# Override name of app
nameOverride: ''
# Override the full qualified app name
fullnameOverride: ''

# Service account configuration (optional)
# Uncomment and configure this section if you want to use a custom service account
# If not specified, no serviceAccountName will be set in the deployment (default K8s behavior)
# serviceAccount:
#   # Specifies whether a service account should be created
#   create: false
#   # Automatically mount a ServiceAccount's API credentials?
#   automount: true
#   # Annotations to add to the service account
#   annotations: {}
#   # The name of the service account to use.
#   # If not set and create is true, a name is generated using the fullname template
#   name: ""

# Define annotations for the Sombra pod
podAnnotations: {}
# Define labels for the Sombra pod
podLabels: {}

# Security context configuration
# Pod-level security context
podSecurityContext: {}
  # fsGroup: 1000
  # runAsNonRoot: true
  # runAsUser: 1000
  # runAsGroup: 1000
  # supplementalGroups: []
  # seccompProfile:
  #   type: RuntimeDefault

# Container-level security context
containerSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000
  # runAsGroup: 1000
  # allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #     - ALL
  # readOnlyRootFilesystem: true
  # seccompProfile:
  #   type: RuntimeDefault

########### Sombra Architecture ###############
# @see https://docs.transcend.io/docs/articles/sombra/architecture

# Define service and ingress for sombra-customer-ingress server
customer_service:
  type: ClusterIP
  port: 5039
  # Annotations to add to the service account
  annotations: {}

customer_ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: sombra-customer.my-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Define service and ingress for sombra-transcend-ingress server
transcend_service:
  type: ClusterIP
  port: 5042
  # Annotations to add to the service account
  annotations: {}

# Optionally set up a "Direct Connection" for Transcend.
transcend_ingress:
  # If this is false, Sombra will use the "Reverse Tunnel" method to connect. We recommend leaving this as false.
  # Read more on the reverse tunnel here: https://docs.transcend.io/docs/articles/sombra/deploying/customizing-sombra/networking#connecting-to-transcend
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: sombra-transcend.my-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Configure the container service with the minimum set of environment variables
# @see https://docs.transcend.io/docs/security/end-to-end-encryption/deploying-sombra#3.-configure-the-container-service-with-the-minimum-set-of-environment-variables

# These environment variables are saved as secret
envs_as_secret:
  - name: JWT_ECDSA_KEY
    value: '<JWT_ECDSA_KEY>'

envs:
  - name: ORGANIZATION_URI
    value: 'some-org'
  - name: SOMBRA_ID
    value: 'some-id'
  - name: EMPLOYEE_AUTHENTICATION_METHODS
    value: 'transcend,session'
  - name: DATA_SUBJECT_AUTHENTICATION_METHODS
    value: 'transcend,session'

# Environment variables populated via the Downward API (fieldRef).
# Exposes pod and node metadata as environment variables.
# @see https://kubernetes.io/docs/concepts/workloads/pods/downward-api/
# Example:
# envs_field_ref:
#   - name: POD_NAME
#     fieldPath: metadata.name
#   - name: POD_IP
#     fieldPath: status.podIP
#   - name: NODE_NAME
#     fieldPath: spec.nodeName
envs_field_ref: []

envFrom: []

# Set to true when deploying multiple Sombra gateways
isMultiTenant: false

# Configuration for log forwarding to Transcend
datadog:
  serviceName: 'customer_hosted_sombra'

# Resource requests and limits for the Sombra pod
resources:
  requests:
    cpu: '2'
    memory: '8Gi'
  limits:
    cpu: '3'
    memory: '12Gi'

# Health check configuration
livenessProbe:
  httpGet:
    path: /health
    port: 5042
    scheme: HTTP
  initialDelaySeconds: 10
  timeoutSeconds: 30
  failureThreshold: 6
  successThreshold: 1
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: 5042
    scheme: HTTP
  initialDelaySeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  periodSeconds: 10
# Startup probe gives the container additional time to come up before the
# liveness and readiness probes begin running. Set `startupProbe: null` to
# disable it entirely.
startupProbe:
  httpGet:
    path: /health
    port: 5042
    scheme: HTTP
  initialDelaySeconds: 10
  timeoutSeconds: 30
  failureThreshold: 30
  successThreshold: 1
  periodSeconds: 10

# The default is 30 seconds.
# We choose a higher grace period to allow more requests to complete.
terminationGracePeriodSeconds: 120

# Host-aliases to define on the pods.
hostAliases: []

# Volumes to add to the pods.
volumes: []
# Volume mounts to add to the pods.
volumeMounts: []

# Enable to use horizontal pod autoscaling based off metrics
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
#  externalMetrics:
#    - name: 'aws.applicationelb.target_response_time.p90'
#      selectorLabels: {}
#      target: {}

# Node selection and scheduling configuration
nodeSelector: {}
tolerations: []
affinity: {}

# Global configuration
global:
  imagePullSecrets:
    - name: transcend-registry

# Data classification service using LLM model
llm-classifier:
  enabled: false

# Pathfinder is AI governance layer that gives you control and auditability on data going in and out of LLMs.
# @see https://docs.transcend.io/docs/pathfinder
pathfinder:
  enabled: false

# Asynchronous Sombra Job Scheduler
job-scheduler:
  enabled: false

# Opt-in OPA (Open Policy Agent) sidecar.
# When enabled, an `opa` container runs alongside Sombra in the same pod. It is
# never exposed through the Sombra Service; Sombra reaches it over the pod
# network at `http://127.0.0.1:<port>` (or the pod IP). The generated default
# `--addr` binds all interfaces so kubelet probes (which dial the pod IP) can
# reach `/health`; override `opa.args` and disable probes if you require
# strict loopback-only isolation.
opa:
  # Set to true to render the OPA sidecar container and (when `config` is
  # non-empty) its ConfigMap.
  enabled: false

  image:
    # Transcend EKS deploys should override repository/tag to the internal
    # seneca-opa image; this default is for generic chart use.
    repository: openpolicyagent/opa
    tag: '0.70.0-static'
    pullPolicy: IfNotPresent

  # Replaces image CMD when non-null. Omit (null) to use the image entrypoint —
  # required for images with baked-in config (e.g. seneca-opa). When `config`
  # is non-empty and `args` is null, the chart generates server defaults bound
  # to all interfaces (so kubelet probes via the pod IP succeed) and appends
  # `--config-file`. When both are empty, no `args` key is rendered.
  args: null

  # Environment variables for the OPA container.
  env: []
  # Load environment variables from ConfigMaps/Secrets, same shape as
  # `envFrom` on the Sombra container.
  envFrom: []

  # Container port OPA listens on. Kept pod-local; not exposed by a Service.
  # Probes target the named port `opa`. When `args` is null and `config` is set,
  # the chart generates `--addr=127.0.0.1:<port>`. Override `args` manually to
  # keep `--addr` in sync when changing this value.
  port: 8181

  # Resource requests and limits for the OPA container. Requests match the
  # ECS opa-mts Fargate reservation (cpu=256 / memory=512); limits give the
  # sidecar 2x headroom to burst. Tune from load-test data.
  resources:
    requests:
      cpu: '250m'
      memory: '512Mi'
    limits:
      cpu: '500m'
      memory: '1Gi'

  # Container-level security context.
  securityContext: {}

  # Health probes against OPA's `/health` endpoint on the named port `opa`.
  # Set any probe to `null` to omit it.
  livenessProbe:
    httpGet:
      path: /health
      port: opa
      scheme: HTTP
    initialDelaySeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: opa
      scheme: HTTP
    initialDelaySeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
    periodSeconds: 10
  # Startup probe gives OPA additional time to come up before liveness and
  # readiness probes begin running. Any probe can be omitted via `null`.
  startupProbe:
    httpGet:
      path: /health
      port: opa
      scheme: HTTP
    initialDelaySeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
    periodSeconds: 10

  # Optional lifecycle hooks. Default empty: static/distroless OPA images
  # have no shell, so a `/bin/sh` preStop would fail on every shutdown.
  lifecycle: {}

  # OPA configuration. When non-empty, a ConfigMap named
  # `<fullname>-opa-config` is rendered and mounted read-only at
  # `configMountPath` (as `configFileName`), and `--config-file` is appended
  # to `args`. When empty, no ConfigMap is created — ensure `args` still
  # point at any image-bundled config (container `args` replace image `CMD`).
  config: {}
  configMountPath: /opa/config
  configFileName: opa-config.yaml

  # Supplemental volumeMounts for the OPA container (in addition to the
  # optional config mount). Mount targets must exist under pod `volumes`.
  volumeMounts: []

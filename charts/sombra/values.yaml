# Default values for sombra-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Namespace in which resources will be deployed
# Create new namespace
createNewNameSpace: true
# Name of new namespace, to use existing one set `createNewNameSpace` to `false`.
namespace: transcend

# Number of instances for the Sombra service.
replicaCount: 1

# Registry server and credential details
# The username will always be "Transcend" (this is case-sensitive),
# and the password will be any API Key for your organization within
# the Admin Dashboard (note: a scope is not required for the API key).
# This will be stored as a docker config secret, named `transcend-registry`
imageCredentials:
  # Set this to false to disable creating a dockerconfigjson file with these credentials.
  # Useful when you don't need username:password based auth for the registry, for ex. when
  # pulling using IAM from ECR.
  enabled: true
  registry: docker.transcend.io
  username: Transcend
  password: null

image:
  # Repository to use for Sombra image
  repository: docker.transcend.io/sombra
  # Define the pullPolicy for Sombra image
  pullPolicy: IfNotPresent
  # Sombra version to deploy
  tag: "latest"

# Override name of app
nameOverride: ""
# Override the full qualified app name
fullnameOverride: ""

# Service account configuration (optional)
# Uncomment and configure this section if you want to use a custom service account
# If not specified, no serviceAccountName will be set in the deployment (default K8s behavior)
# serviceAccount:
#   # Specifies whether a service account should be created
#   create: false
#   # Automatically mount a ServiceAccount's API credentials?
#   automount: true
#   # Annotations to add to the service account
#   annotations: {}
#   # The name of the service account to use.
#   # If not set and create is true, a name is generated using the fullname template
#   name: ""

# Define annotations for the Sombra pod
podAnnotations: {}
# Define labels for the Sombra pod
podLabels: {}

# Security context configuration
# Pod-level security context
podSecurityContext: {}
  # fsGroup: 1000
  # runAsNonRoot: true
  # runAsUser: 1000
  # runAsGroup: 1000
  # supplementalGroups: []
  # seccompProfile:
  #   type: RuntimeDefault

# Container-level security context
containerSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000
  # runAsGroup: 1000
  # allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #     - ALL
  # readOnlyRootFilesystem: true
  # seccompProfile:
  #   type: RuntimeDefault

########### Sombra Architecture ###############
# @see https://docs.transcend.io/docs/articles/sombra/architecture

# Define service and ingress for sombra-customer-ingress server
customer_service:
  type: ClusterIP
  port: 5039
  # Annotations to add to the service account
  annotations: {}

customer_ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: sombra-customer.my-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Define service and ingress for sombra-transcend-ingress server
transcend_service:
  type: ClusterIP
  port: 5042
  # Annotations to add to the service account
  annotations: {}

# Optionally set up a "Direct Connection" for Transcend.
transcend_ingress:
  # If this is false, Sombra will use the "Reverse Tunnel" method to connect. We recommend leaving this as false.
  # Read more on the reverse tunnel here: https://docs.transcend.io/docs/articles/sombra/deploying/customizing-sombra/networking#connecting-to-transcend
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: sombra-transcend.my-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Configure the container service with the minimum set of environment variables
# @see https://docs.transcend.io/docs/security/end-to-end-encryption/deploying-sombra#3.-configure-the-container-service-with-the-minimum-set-of-environment-variables

# These environment variables are saved as secret
envs_as_secret:
  - name: JWT_ECDSA_KEY
    value: '<JWT_ECDSA_KEY>'

envs:
  - name: ORGANIZATION_URI
    value: 'some-org'
  - name: SOMBRA_ID
    value: 'some-id'
  - name: EMPLOYEE_AUTHENTICATION_METHODS
    value: 'transcend,session'
  - name: DATA_SUBJECT_AUTHENTICATION_METHODS
    value: 'transcend,session'
  - name: LLM_CLASSIFIER_URL
    value: http://<RELEASE_NAME>-llm-classifier.transcend.svc:6081

envFrom: []

# Set to true when deploying multiple Sombra gateways
isMultiTenant: false

# Configuration for log forwarding to Transcend
datadog:
  serviceName: 'customer_hosted_sombra'

# Resource requests and limits for the Sombra pod
resources:
   requests:
    memory: '1000Mi'
    cpu: '2000m'
   limits:
    memory: '2000Mi'
    cpu: '3000m'

# Health check configuration
livenessProbe:
  httpGet:
    path: /health
    port: 5042
    scheme: HTTP
readinessProbe:
  httpGet:
    path: /health
    port: 5042
    scheme: HTTP

# Host-aliases to define on the pods.
hostAliases: []

# Volumes to add to the pods.
volumes: []
# Volume mounts to add to the pods.
volumeMounts: []

# Enable to use horizontal pod autoscaling based off metrics
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
#  externalMetrics:
#    - name: 'aws.applicationelb.target_response_time.p90'
#      selectorLabels: {}
#      target: {}

# Node selection and scheduling configuration
nodeSelector: {}
tolerations: []
affinity: {}

# Global configuration
global:
  imagePullSecrets:
  - name: transcend-registry

# Data classification service using LLM model
llm-classifier:
  enabled: false

# Pathfinder is AI governance layer that gives you control and auditability on data going in and out of LLMs.
# @see https://docs.transcend.io/docs/pathfinder
pathfinder:
  enabled: false

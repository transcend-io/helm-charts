{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sombra-job-scheduler.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sombra-job-scheduler.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "sombra-job-scheduler.selectorLabels" . | nindent 4 }}
{{- end }}

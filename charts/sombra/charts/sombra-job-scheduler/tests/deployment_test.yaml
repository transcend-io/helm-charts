# Docs: https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
suite: Deployment
templates:
  - deployment.yaml
release:
  name: testing
tests:
  - it: should render sombra-job-scheduler with readinessProbe
    set:
      enabled: true
      global:
        imagePullSecrets:
          - name: transcend-registry
    asserts:
      - isKind:
          of: Deployment
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/sombra-job-scheduler-alive && find /tmp/sombra-job-scheduler-alive -mmin -1 -print -quit 2>/dev/null | grep -q .
            timeoutSeconds: 30
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 10
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SOMBRA_ID
            value: "some-id"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SOMBRA_JOB_QUEUE_URL
            value: "https://sombra-job-queue.transcend.io/"

  - it: should render fieldRef env vars from envs_field_ref
    set:
      enabled: true
      global:
        imagePullSecrets:
          - name: transcend-registry
      envs_field_ref:
        - name: POD_NAME
          fieldPath: metadata.name
        - name: POD_IP
          fieldPath: status.podIP
        - name: NODE_NAME
          fieldPath: spec.nodeName
    asserts:
      - isKind:
          of: Deployment
        template: deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName

  - it: should not render fieldRef env vars when envs_field_ref is empty
    set:
      enabled: true
      global:
        imagePullSecrets:
          - name: transcend-registry
      envs_field_ref: []
    asserts:
      - isKind:
          of: Deployment
        template: deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

{{- if and .Values.enabled .Values.tls.enabled  -}}
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespace }}
  name: sombra-job-scheduler-secrets
type: Opaque
data:
  sombra-job-scheduler.cert: {{ .Values.tls.cert | b64enc | quote  }}
  sombra-job-scheduler.key: {{ .Values.tls.key | b64enc | quote  }}
{{- end }}

{{- $envs_as_secret_len := len .Values.envs_as_secret }}
{{- $llm_classifier := index .Values "llm-classifier" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sombra-chart.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sombra-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sombra-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $opa := .Values.opa -}}
      {{- if or .Values.podAnnotations (and $opa.enabled $opa.config) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and $opa.enabled $opa.config }}
        checksum/opa-config: {{ toYaml $opa.config | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "sombra-chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "sombra-chart.serviceAccountName" . }}
      {{- end }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.volumes (and $opa.enabled $opa.config) }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and $opa.enabled $opa.config }}
        - name: opa-config
          configMap:
            name: {{ include "sombra-chart.fullname" . }}-opa-config
            defaultMode: 0444
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          env:
            {{- if $llm_classifier.enabled }}
            - name: LLM_CLASSIFIER_URL
              value:  "http://{{ include "llm-classifier.fullname" (dict "Chart" (dict "Name" "llm-classifier") "Release" .Release "Values" $llm_classifier) }}.{{ .Values.namespace }}.svc:6081"
            {{- end }}
            {{- if gt $envs_as_secret_len 0  -}}
            {{- range $name, $value := .Values.envs_as_secret }}
            - name: {{ $value.name }}
              valueFrom:
                secretKeyRef:
                  name: sombra-secrets
                  key: {{ $value.name }}
            {{- end }}
            {{- end }}
            {{- range $name, $value := .Values.envs }}
            - name: {{ $value.name }}
              value: {{ $value.value | quote }}
            {{- end }}
            {{- range $name, $value := .Values.envs_field_ref }}
            - name: {{ $value.name }}
              valueFrom:
                fieldRef:
                  fieldPath: {{ $value.fieldPath }}
            {{- end }}
            - name: IS_MULTI
              value: {{ .Values.isMultiTenant | quote }}
            - name: DD_SERVICE_NAME
              value: {{ .Values.datadog.serviceName | quote }}
          ports:
            - name: external
              containerPort: {{ .Values.transcend_service.port }}
              protocol: TCP
            - name: internal
              containerPort: {{ .Values.customer_service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
        {{- if $opa.enabled }}
        - name: opa
          image: "{{ $opa.image.repository }}:{{ $opa.image.tag }}"
          imagePullPolicy: {{ $opa.image.pullPolicy }}
          {{- with $opa.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $opa.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $opa.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $opa.args $opa.config }}
          args:
            {{- if $opa.args }}
            {{- toYaml $opa.args | nindent 12 }}
            {{- else }}
            - run
            - --server
            - --addr=127.0.0.1:{{ $opa.port }}
            {{- end }}
            {{- if $opa.config }}
            - --config-file={{ $opa.configMountPath }}/{{ $opa.configFileName }}
            {{- end }}
          {{- end }}
          ports:
            - name: opa
              containerPort: {{ $opa.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml $opa.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $opa.readinessProbe | nindent 12 }}
          {{- with $opa.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $opa.resources | nindent 12 }}
          {{- with $opa.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $opa.config $opa.volumeMounts }}
          volumeMounts:
            {{- if $opa.config }}
            - name: opa-config
              mountPath: {{ $opa.configMountPath }}
              readOnly: true
            {{- end }}
            {{- with $opa.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
